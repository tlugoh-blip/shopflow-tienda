<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFlow — Tienda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f1a;
            --surface: #131929;
            --card: #1a2135;
            --border: #2a3555;
            --accent: #f5a623;
            --accent2: #e8722a;
            --text: #f0f4ff;
            --muted: #7a8aad;
            --success: #22c97a;
            --danger: #e74c5e;
            --info: #4f8ef7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sora', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(11,15,26,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 2rem; height: 64px;
        }
        .logo {
            font-size: 1.25rem; font-weight: 700;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: -0.5px;
        }
        .nav-links { display: flex; gap: 0.5rem; }
        .nav-btn {
            background: none; border: 1px solid transparent;
            color: var(--muted); font-family: 'Sora', sans-serif;
            font-size: 0.85rem; padding: 0.4rem 1rem;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .nav-btn:hover { color: var(--text); border-color: var(--border); }
        .nav-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(245,166,35,0.08); }
        .nav-badge {
            background: var(--accent); color: #000;
            font-size: 0.7rem; font-weight: 700;
            padding: 1px 6px; border-radius: 100px; margin-left: 4px;
        }

        .section { display: none; }
        .section.active { display: block; }

        .hero { border-bottom: 1px solid var(--border); line-height: 0; }
        .hero img { width: 100%; display: block; object-fit: cover; max-height: 480px; }

        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        .section-title { font-size: 0.75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 1.5rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; }

        .product-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
            display: flex; flex-direction: column;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-3px); border-color: var(--accent);
            box-shadow: 0 8px 32px rgba(245,166,35,0.12);
        }
        .product-card-img { width: 100%; height: 180px; object-fit: cover; display: block; }
        .product-card-placeholder {
            width: 100%; height: 180px; display: flex; align-items: center;
            justify-content: center; font-size: 3rem;
            background: linear-gradient(135deg, #1a2135, #1e2a45);
        }
        .product-card-body { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
        .product-name { font-size: 1rem; font-weight: 600; margin-bottom: 0.35rem; }
        .product-desc { font-size: 0.82rem; color: var(--muted); flex: 1; margin-bottom: 1rem; line-height: 1.5; }
        .product-price {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem; font-weight: 600; color: var(--accent); margin-bottom: 1rem;
        }
        .stock-badge {
            display: inline-block; font-size: 0.7rem; font-weight: 600;
            padding: 3px 10px; border-radius: 100px; margin-bottom: 1rem;
        }
        .stock-ok { background: rgba(34,201,122,0.12); color: var(--success); border: 1px solid rgba(34,201,122,0.25); }
        .stock-low { background: rgba(245,166,35,0.12); color: var(--accent); border: 1px solid rgba(245,166,35,0.3); }
        .stock-out { background: rgba(231,76,94,0.1); color: var(--danger); border: 1px solid rgba(231,76,94,0.2); }
        .btn-add {
            width: 100%; padding: 0.65rem;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            color: #000; font-family: 'Sora', sans-serif;
            font-size: 0.85rem; font-weight: 700;
            border: none; border-radius: 10px; cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }
        .btn-add:hover { opacity: 0.9; transform: scale(1.02); }
        .btn-add:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

        .cart-section { max-width: 700px; margin: 0 auto; }
        .cart-empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
        .cart-empty .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
        .cart-item {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 1.25rem 1.5rem;
            display: flex; align-items: center; gap: 1rem; margin-bottom: 0.75rem;
        }
        .cart-item-icon { font-size: 1.5rem; min-width: 2.5rem; text-align: center; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.25rem; }
        .cart-item-price { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--muted); }
        .qty-ctrl { display: flex; align-items: center; gap: 0.5rem; }
        .qty-btn {
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text); font-size: 1rem; width: 32px; height: 32px;
            border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .qty-btn:hover { background: var(--border); }
        .qty-num { font-family: 'JetBrains Mono', monospace; min-width: 24px; text-align: center; font-size: 0.9rem; }
        .btn-remove { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1.2rem; padding: 4px; }
        .cart-summary {
            background: var(--card); border: 1px solid var(--accent);
            border-radius: 16px; padding: 1.75rem; margin-top: 1.5rem;
        }
        .cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .cart-total-label { font-size: 0.85rem; color: var(--muted); }
        .cart-total-value { font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; font-weight: 600; color: var(--accent); }
        .order-form { display: grid; gap: 0.85rem; margin-bottom: 1.25rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.75rem; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }
        .form-group input, .form-group textarea {
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text); font-family: 'Sora', sans-serif;
            font-size: 0.9rem; padding: 0.65rem 0.9rem;
            border-radius: 10px; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .btn-primary {
            width: 100%; padding: 0.85rem;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            color: #000; font-family: 'Sora', sans-serif;
            font-size: 0.95rem; font-weight: 700;
            border: none; border-radius: 12px; cursor: pointer; transition: opacity 0.2s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

        .factura-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 1.5rem; margin-bottom: 0.85rem;
        }
        .factura-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
        .factura-id { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--muted); }
        .estado-badge { font-size: 0.7rem; font-weight: 700; padding: 4px 12px; border-radius: 100px; }
        .estado-pendiente { background: rgba(245,166,35,0.12); color: var(--accent); border: 1px solid rgba(245,166,35,0.3); }
        .estado-pagada { background: rgba(34,201,122,0.12); color: var(--success); border: 1px solid rgba(34,201,122,0.25); }
        .factura-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.4rem; }
        .factura-row span:first-child { color: var(--muted); }
        .factura-row span:last-child { font-family: 'JetBrains Mono', monospace; }
        .factura-total-row { border-top: 1px solid var(--border); padding-top: 0.75rem; margin-top: 0.75rem; font-weight: 600; }
        .factura-total-row span:last-child { color: var(--accent); font-size: 1.1rem; }
        .btn-pagar {
            margin-top: 1rem; width: 100%; padding: 0.65rem;
            background: var(--success); color: #000;
            font-family: 'Sora', sans-serif; font-weight: 700; font-size: 0.85rem;
            border: none; border-radius: 10px; cursor: pointer; transition: opacity 0.2s;
        }
        .btn-pagar:hover { opacity: 0.85; }
        .email-lookup {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 1.75rem;
            margin-bottom: 1.5rem; max-width: 700px; margin-left: auto; margin-right: auto;
        }
        .email-lookup-row { display: flex; gap: 0.75rem; }
        .email-lookup-row input { flex: 1; }
        .btn-buscar {
            padding: 0.65rem 1.25rem; background: var(--accent); color: #000;
            font-family: 'Sora', sans-serif; font-weight: 700; font-size: 0.85rem;
            border: none; border-radius: 10px; cursor: pointer; white-space: nowrap;
        }
        .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
        .toast {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 0.85rem 1.25rem;
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 0.88rem; max-width: 320px;
            animation: slideIn 0.3s ease; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        @keyframes slideIn { from { opacity: 0; transform: translateX(2rem); } to { opacity: 1; transform: translateX(0); } }
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 2px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-products { text-align: center; padding: 3rem; color: var(--muted); }
        .facturas-wrapper { max-width: 700px; margin: 0 auto; }
    </style>
</head>
<body>

<nav>
    <div class="logo">⚡ ShopFlow</div>
    <div class="nav-links">
        <button class="nav-btn active" onclick="showSection('catalogo', this)">Catálogo</button>
        <button class="nav-btn" onclick="showSection('carrito', this)" id="nav-carrito">
            Carrito <span class="nav-badge" id="cart-count">0</span>
        </button>
        <button class="nav-btn" onclick="showSection('facturas', this)">Mis Facturas</button>
        <a href="/admin.html" style="text-decoration:none">
            <button class="nav-btn">Admin ↗</button>
        </a>
    </div>
</nav>

<div id="section-catalogo" class="section active">
    <div class="hero">
        <img src="/hero.png" alt="Tu tienda ShopFlow" onerror="this.style.display='none'">
    </div>
    <div class="container">
        <div class="section-title">Productos disponibles</div>
        <div class="products-grid" id="products-grid">
            <div class="loading-products"><div class="spinner"></div><p style="margin-top:1rem">Cargando productos...</p></div>
        </div>
    </div>
</div>

<div id="section-carrito" class="section">
    <div class="container">
        <div class="cart-section">
            <div class="section-title" style="margin-bottom:1.5rem">Tu carrito</div>
            <div id="cart-items-container"></div>
            <div id="cart-summary" style="display:none" class="cart-summary">
                <div class="cart-total">
                    <div>
                        <div class="cart-total-label">Total del pedido</div>
                        <div class="cart-total-value" id="cart-total-value">$0</div>
                    </div>
                </div>
                <div class="order-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>NOMBRE COMPLETO</label>
                            <input type="text" id="cliente-nombre" placeholder="Tu nombre">
                        </div>
                        <div class="form-group">
                            <label>CORREO ELECTRÓNICO</label>
                            <input type="email" id="cliente-email" placeholder="tu@email.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>DIRECCIÓN DE ENTREGA</label>
                        <input type="text" id="cliente-direccion" placeholder="Calle 123 #45-67, Ciudad">
                    </div>
                    <div class="form-group">
                        <label>NOTAS (opcional)</label>
                        <textarea id="pedido-notas" placeholder="Instrucciones especiales..."></textarea>
                    </div>
                </div>
                <button class="btn-primary" id="btn-realizar-pedido" onclick="realizarPedido()">Realizar pedido</button>
            </div>
        </div>
    </div>
</div>

<div id="section-facturas" class="section">
    <div class="container">
        <div class="facturas-wrapper">
            <div class="section-title" style="margin-bottom:1.5rem">Mis facturas</div>
            <div class="email-lookup">
                <div style="font-size:0.85rem;color:var(--muted);margin-bottom:0.75rem">Ingresa tu correo para ver tus facturas</div>
                <div class="email-lookup-row">
                    <input type="email" id="buscar-email" placeholder="tu@email.com" onkeydown="if(event.key==='Enter') buscarFacturas()">
                    <button class="btn-buscar" onclick="buscarFacturas()">Buscar</button>
                </div>
            </div>
            <div id="facturas-container"></div>
        </div>
    </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
    const API = '';
    const FACTURACION_API = 'http://localhost:8081';
    let cart = [];
    let products = [];
    const ICONS = ['📦','💻','📱','🎧','⌨️','🖱️','🖥️','📷','🎮','🔌','💡','🖨️'];

    function showSection(name, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('section-' + name).classList.add('active');
        if (btn) btn.classList.add('active');
        if (name === 'carrito') renderCart();
    }

    function toast(msg, type = 'success') {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> <span>${msg}</span>`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3500);
    }

    async function loadProducts() {
        try {
            const r = await fetch(API + '/api/productos');
            products = await r.json();
            renderProducts();
        } catch(e) {
            document.getElementById('products-grid').innerHTML =
                '<div class="loading-products">❌ No se pudo conectar con la tienda</div>';
        }
    }

    function renderProducts() {
        const g = document.getElementById('products-grid');
        if (!products.length) { g.innerHTML = '<div class="loading-products">Sin productos disponibles</div>'; return; }
        g.innerHTML = products.map((p, i) => {
            const stock = p.stock || 0;
            const stockClass = stock <= 0 ? 'stock-out' : stock < 5 ? 'stock-low' : 'stock-ok';
            const stockText = stock <= 0 ? 'Sin stock' : stock < 5 ? `Solo ${stock} disponibles` : `${stock} en stock`;
            const img = p.imagen ?? p.imageUrl ?? '';
            const mediaHtml = img
                ? `<img class="product-card-img" src="${img}" alt="${p.nombre}" onerror="this.outerHTML='<div class=\\'product-card-placeholder\\'>${ICONS[i % ICONS.length]}</div>'">`
                : `<div class="product-card-placeholder">${ICONS[i % ICONS.length]}</div>`;
            return `
            <div class="product-card">
                ${mediaHtml}
                <div class="product-card-body">
                    <div class="product-name">${p.nombre}</div>
                    <div class="product-desc">${p.descripcion || 'Sin descripción'}</div>
                    <div class="product-price">$${Number(p.precio).toLocaleString('es-CO')}</div>
                    <span class="stock-badge ${stockClass}">${stockText}</span>
                    <button class="btn-add" ${stock <= 0 ? 'disabled' : ''} onclick="addToCart(${p.id})">
                        ${stock <= 0 ? 'Sin stock' : '+ Agregar al carrito'}
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function addToCart(id) {
        const p = products.find(x => x.id === id);
        if (!p) return;
        const idx = cart.findIndex(x => x.id === id);
        if (idx >= 0) { cart[idx].qty++; }
        else { cart.push({ ...p, qty: 1 }); }
        updateCartBadge();
        toast(`"${p.nombre}" agregado al carrito`);
    }

    function updateCartBadge() {
        document.getElementById('cart-count').textContent = cart.reduce((a, c) => a + c.qty, 0);
    }

    function renderCart() {
        const c = document.getElementById('cart-items-container');
        const s = document.getElementById('cart-summary');
        if (!cart.length) {
            c.innerHTML = `<div class="cart-empty"><div class="empty-icon">🛒</div>
                <p style="font-weight:600;margin-bottom:0.5rem">Tu carrito está vacío</p>
                <p style="color:var(--muted);font-size:0.88rem">Agrega productos desde el catálogo</p></div>`;
            s.style.display = 'none'; return;
        }
        c.innerHTML = cart.map(item => `
        <div class="cart-item">
            <div class="cart-item-icon">${item.imagen ? `<img src="${item.imagen}" style="width:40px;height:40px;object-fit:cover;border-radius:8px">` : '📦'}</div>
            <div class="cart-item-info">
                <div class="cart-item-name">${item.nombre}</div>
                <div class="cart-item-price">$${Number(item.precio).toLocaleString('es-CO')} c/u</div>
            </div>
            <div class="qty-ctrl">
                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
                <span class="qty-num">${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
            </div>
            <button class="btn-remove" onclick="removeFromCart(${item.id})">✕</button>
        </div>`).join('');
        const total = cart.reduce((a, c) => a + c.precio * c.qty, 0);
        document.getElementById('cart-total-value').textContent = '$' + Number(total).toLocaleString('es-CO');
        s.style.display = 'block';
    }

    function changeQty(id, delta) {
        const idx = cart.findIndex(x => x.id === id);
        if (idx < 0) return;
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
        updateCartBadge(); renderCart();
    }

    function removeFromCart(id) {
        cart = cart.filter(x => x.id !== id);
        updateCartBadge(); renderCart();
    }

    async function realizarPedido() {
        const nombre = document.getElementById('cliente-nombre').value.trim();
        const email = document.getElementById('cliente-email').value.trim();
        const direccion = document.getElementById('cliente-direccion').value.trim();
        if (!nombre || !email || !direccion) { toast('Completa todos los campos requeridos', 'error'); return; }
        if (!cart.length) { toast('El carrito está vacío', 'error'); return; }

        const btn = document.getElementById('btn-realizar-pedido');
        btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Procesando...';

        const payload = {
            clienteNombre: nombre,
            clienteEmail: email,
            direccionEntrega: direccion,
            detalles: cart.map(c => ({
                productoId: c.id,
                cantidad: c.qty
            }))
        };

        try {
            const r = await fetch(API + '/api/pedidos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!r.ok) {
                const err = await r.text();
                throw new Error(err);
            }
            cart = []; updateCartBadge();
            toast('¡Pedido realizado! Revisa tus facturas para pagar.');
            btn.disabled = false; btn.textContent = 'Realizar pedido';
            renderCart();
        } catch(e) {
            toast('Error al crear el pedido: ' + (e.message || ''), 'error');
            btn.disabled = false; btn.textContent = 'Realizar pedido';
        }
    }

    async function buscarFacturas() {
        const email = document.getElementById('buscar-email').value.trim();
        if (!email) { toast('Ingresa tu correo', 'error'); return; }
        const c = document.getElementById('facturas-container');
        c.innerHTML = '<div class="loading-products"><div class="spinner"></div></div>';
        try {
            const r = await fetch(FACTURACION_API + '/api/facturas/cliente/' + encodeURIComponent(email));
            const facturas = await r.json();
            if (!facturas.length) { c.innerHTML = '<div class="loading-products">Sin facturas para este correo</div>'; return; }
            c.innerHTML = facturas.map(f => `
            <div class="factura-card" id="factura-${f.id}">
                <div class="factura-header">
                    <span class="factura-id"># Pedido ${f.pedidoId}</span>
                    <span class="estado-badge ${f.estado === 'PAGADA' ? 'estado-pagada' : 'estado-pendiente'}">${f.estado}</span>
                </div>
                <div class="factura-row"><span>Cliente</span><span>${f.clienteNombre}</span></div>
                <div class="factura-row"><span>Subtotal</span><span>$${Number(f.subtotal).toLocaleString('es-CO')}</span></div>
                <div class="factura-row"><span>IVA (19%)</span><span>$${Number(f.iva).toLocaleString('es-CO')}</span></div>
                <div class="factura-row factura-total-row"><span>Total</span><span>$${Number(f.total).toLocaleString('es-CO')}</span></div>
                ${f.estado !== 'PAGADA' ? `<button class="btn-pagar" onclick="pagarFactura(${f.pedidoId}, ${f.id})">💳 Confirmar pago</button>` : '<div style="margin-top:1rem;text-align:center;color:var(--success);font-size:0.85rem;font-weight:600">✅ Factura pagada — Envío en proceso</div>'}
            </div>`).join('');
        } catch(e) { c.innerHTML = '<div class="loading-products">❌ Error al cargar facturas</div>'; }
    }

    async function pagarFactura(pedidoId, facturaId) {
        const btn = document.querySelector(`#factura-${facturaId} .btn-pagar`);
        if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Procesando...'; }
        try {
            const r = await fetch(FACTURACION_API + '/api/facturas/pagar/' + pedidoId, { method: 'PUT' });
            if (!r.ok) throw new Error();
            toast('✅ Pago confirmado. Logística iniciará el envío.');
            buscarFacturas();
        } catch(e) {
            toast('Error al procesar el pago', 'error');
            if (btn) { btn.disabled = false; btn.textContent = '💳 Confirmar pago'; }
        }
    }

    loadProducts();
</script>
</body>
</html>
